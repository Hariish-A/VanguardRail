[project]
name = "demo-agent"
version = "0.1.0"
description = "A Qwen3-powered agent whose every tool call is governed by Guardrail."
requires-python = ">=3.12"
dependencies = [
    "guardrail-sdk",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[project.scripts]
demo-agent = "demo_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_agent"]

[tool.uv.sources]
guardrail-sdk = { workspace = true }
