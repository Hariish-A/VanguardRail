[project]
name = "guardrail-infra"
version = "0.1.0"
description = "AWS CDK definitions for the Guardrail control plane."
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.180.0",
    "constructs>=10.3,<11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stacks"]
