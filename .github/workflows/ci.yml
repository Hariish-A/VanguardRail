name: CI

# Quality gates run on every push. Deployment runs only on main, and only after the
# gates pass -- including the cost scan, which is what keeps the $0 commitment real
# rather than aspirational.

on:
  push:
    # `master` is this repository's working branch; `main` is kept for the deploy job,
    # which is gated on it separately below. Filtering pushes to `main` alone meant the
    # whole workflow silently never ran -- the checks existed and were never executed,
    # which is indistinguishable from not having them.
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel superseded runs on a branch, but never cancel a deploy midway.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_VERSION: "0.5.11"

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy packages

      - name: Unit tests
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

      # The conformance suite runs offline against the policy bundle in the repo, so a
      # rule regression fails the pull request rather than being discovered after a
      # deploy. It needs no AWS, no credentials, and no network.
      - name: Validate scenarios against the policy bundle
        run: uv run guardrail-sim validate scenarios/ --policy policies/default.yaml

      - name: Policy conformance (offline)
        run: |
          uv run guardrail-sim run scenarios/             --policy policies/default.yaml             --junit reports/conformance-offline.xml             --html reports/conformance-offline.html

      # Proves dry-run reports what enforcement would really do. Without it, "shadow
      # mode says the change is safe" is an unverified claim people deploy on.
      - name: Dry-run parity
        run: uv run guardrail-sim parity scenarios/ --policy policies/default.yaml

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-offline
          path: reports/
          retention-days: 14

  portability:
    name: Portability (container runs the same suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --all-extras --frozen

      # The Dockerfile claimed portability from M0 and had never been built and run.
      # When it finally was, the image did not start -- guardrail-core had been installed
      # as an editable, leaving a .pth pointing at a build-stage path. An identical green
      # report from a plain container is what makes "not Lambda-locked" a fact.
      - name: Build the image and run the conformance suite against it
        run: uv run python scripts/portability_proof.py

  cost-gate:
    name: Cost gate (no paid AWS resources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --all-extras --frozen

      - name: Synthesize CloudFormation
        working-directory: infra
        # Bundling is skipped here on purpose: this job inspects resource *types*, and
        # skipping the Docker build makes the gate fast. The deploy job below does a
        # real bundled synth.
        env:
          GUARDRAIL_SKIP_BUNDLING: "1"
          GUARDRAIL_STAGE: dev
          CDK_DEFAULT_ACCOUNT: "000000000000"
          CDK_DEFAULT_REGION: us-east-1
        run: uv run python app.py

      - name: Scan for paid resources
        run: uv run python scripts/check_banned_resources.py infra/cdk.out

  deploy:
    name: Deploy to dev
    needs: [quality, cost-gate, portability]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write # required for OIDC; no long-lived AWS keys exist anywhere
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --all-extras --frozen

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: guardrail-ci-${{ github.run_id }}

      - name: Install CDK CLI
        run: npm install --global aws-cdk@2

      - name: Deploy
        working-directory: infra
        env:
          GUARDRAIL_STAGE: dev
          GUARDRAIL_VERSION: ${{ github.sha }}
          GUARDRAIL_ALERT_EMAIL: ${{ secrets.GUARDRAIL_ALERT_EMAIL }}
          GUARDRAIL_API_KEYS_JSON: ${{ secrets.GUARDRAIL_API_KEYS_JSON }}
          # Empty unless the secret is set, which leaves policy administration closed.
          GUARDRAIL_POLICY_ADMIN_KEY_IDS: ${{ secrets.GUARDRAIL_POLICY_ADMIN_KEY_IDS }}
        run: cdk deploy --all --require-approval never --outputs-file outputs.json

      - name: Smoke test the deployment
        working-directory: infra
        # The deploy is not "done" until the live URL answers correctly with the SHA
        # that was just built. CloudFront needs a moment to propagate the new origin.
        run: |
          BASE_URL=$(python -c "import json;print(json.load(open('outputs.json'))['Guardrail-Service-dev']['BaseUrl'])")
          echo "Base URL: $BASE_URL"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 15 "$BASE_URL/healthz" > health.json; then
              cat health.json
              break
            fi
            echo "attempt $attempt failed; waiting for CloudFront propagation"
            sleep 20
          done
          python - <<'PY'
          import json, sys
          health = json.load(open("health.json"))
          expected = "${{ github.sha }}"
          assert health["status"] == "ok", health
          assert health["version"] == expected, f"deployed {health['version']}, expected {expected}"
          print("smoke test passed:", health)
          PY

      - name: Verify the deployed edge matches the configured mode
        working-directory: infra
        # With CloudFront disabled (the default -- new AWS accounts cannot create
        # distributions without a support case) the Function URL *is* the endpoint and
        # correctly answers 200. An earlier version of this step asserted 403, which was
        # right only while CloudFront fronted the origin; it would have failed every run.
        run: |
          EDGE=$(python -c "import json;print(json.load(open('outputs.json'))['Guardrail-Service-dev']['EdgeMode'])")
          FUNCTION_URL=$(python -c "import json;print(json.load(open('outputs.json'))['Guardrail-Service-dev']['FunctionUrl'])")
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$FUNCTION_URL/healthz")
          echo "EdgeMode=$EDGE, direct origin call returned HTTP $STATUS"

          if [ "$EDGE" = "cloudfront" ]; then
            # OAC must make the raw origin unreachable.
            [ "$STATUS" = "403" ] || { echo "FAIL: origin exposed despite CloudFront"; exit 1; }
          else
            [ "$STATUS" = "200" ] || { echo "FAIL: Function URL should serve directly"; exit 1; }
          fi

      - name: Post-deploy conformance against the live endpoint
        working-directory: infra
        env:
          GUARDRAIL_API_KEY: ${{ secrets.GUARDRAIL_CI_API_KEY }}
        # The same scenarios that gated the pull request, now against deployed AWS --
        # which additionally exercises auth, DynamoDB, the audit write, and whichever
        # policy version is actually active. A green offline report says nothing about
        # production unless this also passes.
        run: |
          BASE=$(python -c "import json;print(json.load(open('outputs.json'))['Guardrail-Service-dev']['BaseUrl'])")
          cd ..
          uv run guardrail-sim run scenarios/             --endpoint "$BASE"             --junit reports/conformance-live.xml             --html reports/conformance-live.html

      - name: Upload live conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-live
          path: reports/
          retention-days: 30

      - name: Verify data endpoints reject unauthenticated callers
        working-directory: infra
        # The edge is deliberately public, so authentication is the control that
        # actually protects tool-call arguments. Asserted on every deploy.
        run: |
          BASE=$(python -c "import json;print(json.load(open('outputs.json'))['Guardrail-Service-dev']['BaseUrl'])")
          for path in /v1/evaluate /v1/audit; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -X POST "$BASE$path" -d '{}' -H 'content-type: application/json')
            echo "$path unauthenticated -> HTTP $STATUS"
            [ "$STATUS" = "401" ] || { echo "FAIL: $path did not require authentication"; exit 1; }
          done
