# Local development stack.
#
# Deliberately does NOT include Ollama. On Windows, Ollama in a container loses GPU
# access unless WSL2 + CUDA passthrough is configured, which makes Qwen3 markedly
# slower for no benefit. Run it natively (`ollama serve`) and the agent in M2 reaches
# it at host.docker.internal:11434.

services:
  guardrail:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      GUARDRAIL_STAGE: local
      GUARDRAIL_VERSION: local-dev
      GUARDRAIL_LOG_LEVEL: DEBUG
      GUARDRAIL_AWS_REGION: us-east-1
      # Wired up in M1, when the tables exist.
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      dynamodb:
        condition: service_started
    restart: unless-stopped

  # DynamoDB Local, so the M1 data layer can be developed and tested without an AWS
  # account and without consuming any free-tier capacity.
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/data
    working_dir: /home/dynamodblocal

volumes:
  dynamodb-data:
