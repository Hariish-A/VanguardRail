[project]
name = "guardrail"
version = "0.1.0"
description = "Action-layer governance for AI agents — policy enforcement at the moment of tool execution"
requires-python = ">=3.12"
dependencies = [
    "guardrail-core",
    "guardrail-service",
    "guardrail-sdk",
]

[tool.uv.workspace]
members = ["packages/*", "infra", "apps/*"]

[tool.uv.sources]
guardrail-core = { workspace = true }
guardrail-service = { workspace = true }
guardrail-infra = { workspace = true }
guardrail-sdk = { workspace = true }
demo-agent = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "boto3>=1.35",
    "boto3-stubs[dynamodb,ssm]>=1.35",
    # Serving the app locally. Not bundled into the Lambda zip — Mangum is the
    # entrypoint there, so uvicorn would be dead weight against the 250 MB limit.
    "uvicorn[standard]>=0.30",
    "types-pyyaml>=6.0",
    # Infra is a dev dependency: CDK is only needed to synth/deploy, never at runtime.
    "guardrail-infra",
    "demo-agent",
]

# ----------------------------------------------------------------------------
# Lint / format
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["infra/cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
# These exceptions are control flow an agent catches by name -- `except ActionBlocked`
# reads better than `except ActionBlockedError` at every call site, and they are part
# of the SDK's public vocabulary.
"packages/guardrail-sdk/src/guardrail_sdk/exceptions.py" = ["N818"]

# ----------------------------------------------------------------------------
# Types
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["infra/cdk.out", "build", "dist"]

[[tool.mypy.overrides]]
module = ["mangum.*", "aws_cdk.*", "constructs.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# Tests
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: hits a deployed environment; requires GUARDRAIL_BASE_URL",
]

[tool.coverage.run]
source = ["packages"]
omit = ["*/tests/*"]
