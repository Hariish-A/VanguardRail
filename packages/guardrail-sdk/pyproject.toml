[project]
name = "guardrail-sdk"
version = "0.1.0"
description = "Client SDK that enforces Guardrail policy before an agent's tool call executes."
requires-python = ">=3.12"
dependencies = [
    "guardrail-core",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guardrail_sdk"]

[tool.uv.sources]
guardrail-core = { workspace = true }
