[project]
name = "guardrail-core"
version = "0.1.0"
description = "Pure policy-evaluation engine. No I/O, no AWS, no network — fully unit-testable."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guardrail_core"]
