[project]
name = "guardrail-service"
version = "0.1.0"
description = "Guardrail control plane — FastAPI app served by Lambda (Mangum) or any container."
requires-python = ">=3.12"
dependencies = [
    "guardrail-core",
    "fastapi>=0.115",
    "mangum>=0.19",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "aws-lambda-powertools>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Only needed when running the app as a container / locally. On Lambda the runtime
# provides uvicorn's job (Mangum) and boto3, so these stay out of the zip.
serve = [
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guardrail_service"]

[tool.uv.sources]
guardrail-core = { workspace = true }
